<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>VigifyOS</title>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f8fafc;
    }

    #vigifyApp {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background-color: #ffffff;
    }

  </style>

</head>

<body>

<iframe
  id="vigifyApp"
  title="VigifyOS"
  src="https://script.google.com/macros/s/AKfycbzTmGFV1toKDexDbS0-3pGvnUjDyyenN0zlKkBz0Tbx/dev?p=login"
  allow="camera; geolocation">
</iframe>

<script>

  const URL_BASE_VIGIFY =
    "https://script.google.com/macros/s/AKfycbzTmGFV1toKDexDbS0-3pGvnUjDyyenN0zlKkBz0Tbx/dev";

  window.addEventListener(
    "message",
    function(evento) {

      const origemPermitida =
        evento.origin === "https://script.google.com" ||
        evento.origin.endsWith(
          ".script.googleusercontent.com"
        );

      if (!origemPermitida) {
        return;
      }

      if (
        !evento.data ||
        evento.data.tipo !==
          "VIGIFY_NAVEGACAO"
      ) {
        return;
      }

      const iframe =
        document.getElementById(
          "vigifyApp"
        );

      if (
        evento.data.destino ===
        "login"
      ) {

        iframe.src =
          URL_BASE_VIGIFY +
          "?p=login";

      }

    }
  );

</script>

</body>

</html>
