<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Cardens DEV</title>

  <style>

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f8fafc;
    }

    #cardensApp {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background-color: #ffffff;
    }

  </style>

</head>

<body>

  <iframe
    id="cardensApp"
    title="Cardens"
    allow="camera; geolocation">
  </iframe>

  <script>

    const iframeCardens =
      document.getElementById(
        "cardensApp"
      );

    const chaveNavegacaoCardens =
      "CARDENS_PORTAL_URL_ATUAL";


// ========================================================
// RESTAURA A NAVEGAÇÃO ATUAL DO CARDENS
// ========================================================
function restaurarNavegacaoCardens() {

  const urlLogin =
    "https://script.google.com/macros/s/AKfycbw8jNh0fd78zw0D281S7djMNAMRmyc-5RG1i0Anr1xmnZtKKVqDD29nvt3ziZWCqCXB/exec?p=login&origem=portal";

  const urlSalva =
    localStorage.getItem(
      chaveNavegacaoCardens
    );

  if (
    urlSalva &&
    urlSalva.startsWith(
      "https://script.google.com/macros/s/"
    )
  ) {

    iframeCardens.src =
      urlSalva;

    return;

  }

  if (
    urlSalva
  ) {

    localStorage.removeItem(
      chaveNavegacaoCardens
    );

  }

  iframeCardens.src =
    urlLogin;

}


    // ========================================================
    // RECEBE COMANDOS DE NAVEGAÇÃO DO CARDENS
    // ========================================================
    window.addEventListener(
      "message",
      function(evento) {

        const origemPermitida =
          evento.origin ===
            "https://script.google.com" ||
          evento.origin.endsWith(
            ".script.googleusercontent.com"
          ) ||
          evento.origin.endsWith(
            "script.googleusercontent.com"
          );

        if (!origemPermitida) {
          return;
        }

        if (
          !evento.data
        ) {
          return;
        }

// SALVA A SESSÃO ATUAL SEM RECARREGAR O IFRAME.
if (
  evento.data.tipo ===
  "CARDENS_SESSAO_ATUAL"
) {

  const urlSessao =
    String(
      evento.data.url || ""
    ).trim();

  if (
    !urlSessao.startsWith(
      "https://script.google.com/macros/s/"
    )
  ) {

    console.error(
      "URL de sessão Cardens inválida."
    );

    return;

  }

  localStorage.setItem(
    chaveNavegacaoCardens,
    urlSessao
  );

  return;

}

        // SINCRONIZA A ROTA INTERNA DO ADMIN.
        if (
          evento.data.tipo ===
          "CARDENS_ROTA_ADMIN"
        ) {

          const rota =
            String(
              evento.data.rota || ""
            )
              .trim()
              .toLowerCase();

          if (!rota) {
            return;
          }

          const urlAtual =
            localStorage.getItem(
              chaveNavegacaoCardens
            );

          if (
            urlAtual &&
            urlAtual.startsWith(
              "https://script.google.com/macros/s/"
            )
          ) {

            const urlSemHash =
              urlAtual.split(
                "#"
              )[0];

            localStorage.setItem(
              chaveNavegacaoCardens,
              urlSemHash +
              "#" +
              rota
            );

          }

          history.replaceState(
            null,
            "",
            "#" + rota
          );

          return;

        }

        if (
          evento.data.tipo !==
          "CARDENS_NAVEGACAO"
        ) {
          return;
        }

        const urlDestino =
          String(
            evento.data.url || ""
          ).trim();

        if (
          !urlDestino.startsWith(
            "https://script.google.com/macros/s/"
          )
        ) {

          console.error(
            "URL de navegação Cardens inválida."
          );

          return;
        }

        if (
          evento.data.destino !==
          "admin"
        ) {

          history.replaceState(
            null,
            "",
            window.location.pathname
          );

        }

        if (
          evento.data.destino ===
          "login"
        ) {

          localStorage.removeItem(
            chaveNavegacaoCardens
          );

          iframeCardens.src =
            urlDestino;

          return;
        }

        localStorage.setItem(
          chaveNavegacaoCardens,
          urlDestino
        );

        iframeCardens.src =
          urlDestino;

      }
    );


    restaurarNavegacaoCardens();

  </script>

</body>

</html>
